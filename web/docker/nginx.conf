# slotfare-console server block. Replaces nginx's conf.d/default.conf.
#
# Caching policy: hashed production assets (Angular outputHashing "all") are
# long-lived and immutable; index.html and config.json are no-cache so a new
# deploy is picked up on the next load; everything else falls through to the
# SPA fallback.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # k8s liveness/readiness probe.
    location = /health {
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # Runtime config must never be cached: it carries the API base URL.
    location = /config.json {
        add_header Cache-Control "no-cache";
    }

    # Entrypoint shell: revalidate on every request.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed static assets: cache forever.
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
